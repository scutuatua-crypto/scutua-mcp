# ก็อปทั้งหมดเลยครับ
# .github/workflows/keep-alive.yml
name: Keep Scutua-MCP alive

on:
  schedule:
    - cron: "*/14 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    env:
      MCP_URL: ${{ secrets.MCP_URL }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      - name: Ping MCP server (with retry)
        id: ping
        run: |
          PING_URL="${MCP_URL:-https://scutua-mcp.onrender.com/mcp}"
          HEALTH_URL="${PING_URL%/mcp}/health"

          echo "Pinging: $HEALTH_URL"
          
          MAX_RETRIES=3
          RETRY_COUNT=0
          STATUS="000"
          
          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            RETRY_COUNT=$((RETRY_COUNT + 1))
            echo "Attempt $RETRY_COUNT/$MAX_RETRIES..."
            
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 --connect-timeout 5 "$HEALTH_URL" || echo "000")
            
            if [ "$STATUS" = "000" ]; then
              echo "Health endpoint unreachable, trying MCP root..."
              STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 --connect-timeout 5 "$PING_URL" || echo "000")
            fi
            
            echo "Response: HTTP $STATUS"
            
            if [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 400 ]; then
              echo "✓ Server alive (HTTP $STATUS)"
              exit 0
            fi
            
            if [ $RETRY_COUNT -lt $MAX_RETRIES ]; then
              echo "Waiting 5 seconds before retry..."
              sleep 5
            fi
          done
          
          echo "✗ Server may be down after $MAX_RETRIES attempts (Last: HTTP $STATUS)"
          exit 1

      - name: Alert on failure (Telegram)
        if: failure() && env.TELEGRAM_BOT_TOKEN != ''
        run: |
          curl -s -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d text="⚠️ Scutua-MCP keep-alive failed after 3 retries! Check Render dashboard."
